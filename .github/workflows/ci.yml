name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # TypeScript workspace: catalog build/lints/hash, codegen drift, protocol +
  # room/match reducer tests, type-checks. Runs the full turbo pipeline.
  # ---------------------------------------------------------------------------
  ts:
    name: TypeScript (bun + turbo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Check types, test, build
        run: bunx turbo run check-types test build --filter='!battle-server'

  # ---------------------------------------------------------------------------
  # .NET engine + battle server: build the solution and run xUnit tests
  # (golden scenarios, repeat-seed determinism, placement properties, codegen
  # drift guard, and eventually the ported server conformance suite).
  # ---------------------------------------------------------------------------
  dotnet:
    name: .NET (engine + server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore dotnet/BoardGame.sln

      - name: Build
        run: dotnet build dotnet/BoardGame.sln -c Release --no-restore --nologo

      - name: Test
        run: dotnet test dotnet/BoardGame.sln -c Release --no-build --nologo

      - name: Publish battle server (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: >-
          dotnet publish dotnet/BoardGame.BattleServer -c Release
          -r linux-x64 --self-contained
          -o dotnet/artifacts/publish/BoardGame.BattleServer
